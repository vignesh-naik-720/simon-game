services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: simon-backend
    ports:
      - "5000:5000"
    volumes:
      - simon_sqlite_data:/app/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/simon.db
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: simon-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  simon_sqlite_data:
    driver: local
